name: Build Dedoom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Dedoom.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Dedoom-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dedoom-Release-APK
          path: dist/Dedoom.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dedoom v1.0.0 (Release)"
          body: |
            ### 🧘 Dedoom Android App (Release Build)
            Official release APK built automatically by GitHub Actions.

            #### 📲 Installation Instructions:
            1. Download **`Dedoom.apk`** below directly to your Android device.
            2. If tapping the download notification in Chrome doesn't install or loops:
               - Open your phone's **Files** (or **My Files**) app.
               - Go to the **Downloads** folder.
               - Tap **`Dedoom.apk`** to install.
               - If prompted, toggle on **"Allow from this source"** / **"Install unknown apps"**.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Dedoom.apk
            dist/Dedoom-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
