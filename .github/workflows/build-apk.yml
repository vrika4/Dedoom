name: Build Descroll APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Descroll.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Descroll-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Descroll-Release-APK
          path: dist/Descroll.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Descroll v1.0.0 (Release)"
          body: |
            ### 🧘 Descroll Android App (Release Build)
            Official release APK built automatically by GitHub Actions.

            #### 📲 Installation Instructions:
            1. Download **`Descroll.apk`** below directly to your device.
            2. Open your phone's **Files** app -> **Downloads** folder.
            3. Tap **`Descroll.apk`** to install.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Descroll.apk
            dist/Descroll-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
