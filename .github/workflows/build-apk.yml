name: Build Descroll APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          cp "$APK_FILE" dist/Descroll.apk
          cp "$APK_FILE" dist/Descroll-v2.1.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Descroll-Release-APK
          path: dist/Descroll.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v2.1.0' }}
          target_commitish: ${{ github.sha }}
          name: "Descroll v2.1.0 (Home Feed Shield Release)"
          body: |
            ### 🛡️ Descroll Android App v2.1.0
            Reverse-engineered ScrollGuard engine to break doom-scrolling without blocking messaging or feeds.

            #### ⚡ What's New in v2.1.0:
            - **Home Feed Black Cover Shield (ScrollGuard Feature)**:
              - Dynamically places an opaque distraction shield directly over embedded Reels carousels and YouTube Shorts shelves on your home feeds.
              - Completely obscures autoplaying videos, thumbnails, and dopamine triggers.
              - Keeps home feed scrolling 100% fluid, natural, and unrestricted.
            - **Strict Daily Limit (10 Reels/Day)**:
              - Full-screen reels and shorts are capped at 10 distinct videos per day.
              - Instant back kickout (`GLOBAL_ACTION_BACK`) + Blocked screen once 10 reels are reached.
            - **Zero Collateral Blocking**:
              - Direct Messages (DMs), Stories, regular posts, profiles, and channels are NEVER blocked.
            - **Toggle Control**:
              - Enable or disable Home Feed Cover anytime right from the main dashboard.

            #### 📲 Installation Instructions:
            1. Download **`Descroll.apk`** below directly to your Android device.
            2. Open your phone's **Files** (or **My Files**) app -> **Downloads** folder.
            3. Tap **`Descroll.apk`** to install.
            4. If prompted, toggle on **"Allow from this source"** / **"Install unknown apps"**.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Descroll.apk
            dist/Descroll-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
